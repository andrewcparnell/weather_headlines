name: Refresh Weather & Deploy Pages

on:
  schedule:
    # Runs every 6 hours shortly after ECMWF 00z, 06z, 12z, and 18z Open Data runs publish
    - cron: "25 1,7,13,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages-weather-headlines
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Cache ERA5 historical point series
        uses: actions/cache@v4
        with:
          path: pipeline_cache/era5_points
          key: era5-points-v2-${{ runner.os }}-${{ hashFiles('pipeline/climatology.py') }}
          restore-keys: |
            era5-points-v2-${{ runner.os }}-
            era5-points-v2-

      - name: Restore latest headlines.json from orphan data branch
        run: |
          mkdir -p site/data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:headlines.json > site/data/headlines.json || true
          fi

      - name: Install dependencies
        run: uv sync --frozen

      - name: Refresh live ECMWF weather layers and 5-story bulletin
        env:
          ANTHROPIC_API_KEY: ${{ github.event_name != 'push' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          uv run --frozen python -m pipeline.build --keep-existing-headlines-if-no-key

      - name: Run pipeline and data integrity tests
        run: uv run --frozen pytest -v

      - name: Snapshot headlines.json to orphan data branch (without touching main)
        if: github.event_name != 'push'
        run: |
          SNAPSHOT_DIR=$(mktemp -d)
          cp site/data/headlines.json "${SNAPSHOT_DIR}/headlines.json"
          cd "${SNAPSHOT_DIR}"
          git init -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add headlines.json
          git commit -m "chore: snapshot latest headlines.json"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:data || echo "::warning::Unable to push headlines.json snapshot to data branch."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload static site artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
