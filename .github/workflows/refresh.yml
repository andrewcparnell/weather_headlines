name: Refresh Weather & Deploy Pages

on:
  schedule:
    # Runs every 6 hours shortly after ECMWF 00z, 06z, 12z, and 18z Open Data runs publish
    - cron: "25 1,7,13,19 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: pages-weather-headlines
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Restore ERA5 climatology cache
        if: github.event_name != 'push'
        uses: actions/cache@v4
        with:
          path: pipeline_cache/climatology
          key: era5-climo-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            era5-climo-v1-${{ runner.os }}-
            era5-climo-v1-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Fetch live ECMWF weather, ERA5 rankings, and generate 5-story bulletin
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          uv run --frozen python -m pipeline.build --keep-existing-headlines-if-no-key
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret is not set yet. Live ECMWF weather layers were refreshed; add ANTHROPIC_API_KEY under Settings -> Secrets and variables -> Actions to enable 6-hourly Claude + web-search headline updates."
          fi

      - name: Run pipeline and data integrity tests
        run: uv run --frozen pytest -v

      - name: Commit refreshed 6-hourly weather data to main
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh 6-hourly weather headlines [skip ci]"
            git pull --rebase -X theirs origin main && git push origin HEAD:main || echo "::warning::Skipped git push due to concurrent main branch update; deploying fresh site artifact directly."
          fi

      - name: Upload static site artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
