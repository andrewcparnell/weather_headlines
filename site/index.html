<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weather Headlines · Aimsir Live Global Weather</title>
  <meta name="description" content="Explore live global ECMWF weather forecasts on an interactive 3D Earth and watch a 6-hourly broadcast tour of the world's top 5 weather stories.">
  <link rel="canonical" href="https://headlines.aimsir.org/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Aimsir · Weather Headlines">
  <meta property="og:title" content="Weather Headlines · Live Global Weather">
  <meta property="og:description" content="Interactive 3D live global weather explorer and 6-hourly broadcast tour of the world's top 5 weather events.">
  <meta property="og:url" content="https://headlines.aimsir.org/">
  <meta property="og:image" content="https://headlines.aimsir.org/icon-512.png">
  <meta name="theme-color" content="#050b14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Headlines">
  <link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="style.css?v=c499fb13">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js"
      }
    }
  </script>
  <link rel="modulepreload" href="./vendor/three.module.js">
  <link rel="modulepreload" href="./vendor/three.core.min.js">
  <link rel="modulepreload" href="./vendor/OrbitControls.js">
  <link rel="modulepreload" href="./js/globe.js?v=c499fb13">
  <link rel="modulepreload" href="./js/tour.js?v=c499fb13">
  <link rel="modulepreload" href="./js/search.js?v=c499fb13">
</head>
<body>
  <!-- Full-screen interactive 3D Globe -->
  <div id="globeStage" class="globe-stage" aria-label="Interactive 3D weather globe"></div>
  <div id="globeOverlay" class="globe-overlay"></div>

  <!-- Top-left: Country & City Search + Report Schedule -->
  <header class="top-left-bar" id="exploreHeader">
    <div class="search-box" role="search">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12.8 12.8L17.2 17.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input
        id="searchInput"
        type="search"
        placeholder="Search country or city..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Search country or city"
        aria-controls="searchResults"
        aria-expanded="false"
      >
      <div id="searchResults" class="search-results" role="listbox" hidden></div>
    </div>
    <div class="live-pill" id="liveBadge">
      <div class="live-pill-row">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="liveTimestamp">Report created: Loading...</span>
      </div>
      <div class="live-pill-sub" id="nextReportTimestamp">Next report: --</div>
    </div>
  </header>

  <!-- Local Weather Readout Card (Explore mode) -->
  <aside id="spotCard" class="spot-card" hidden aria-live="polite">
    <div class="spot-header">
      <div>
        <div id="spotSub" class="spot-sub">Selected Location</div>
        <h2 id="spotTitle" class="spot-title">Dublin</h2>
      </div>
      <button id="spotClose" class="icon-close" type="button" aria-label="Close location weather">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="spot-grid">
      <div class="spot-metric">
        <span class="spot-label">Temperature</span>
        <strong id="spotTemp">--</strong>
      </div>
      <div class="spot-metric">
        <span class="spot-label">Anomaly</span>
        <strong id="spotAnom">--</strong>
      </div>
      <div class="spot-metric">
        <span class="spot-label">10 m Wind</span>
        <strong id="spotWind">--</strong>
      </div>
      <div class="spot-metric">
        <span class="spot-label">24 h Rain</span>
        <strong id="spotRain">--</strong>
      </div>
      <div class="spot-metric">
        <span class="spot-label">Pressure</span>
        <strong id="spotPressure">--</strong>
      </div>
    </div>
  </aside>

  <!-- Right side: Weather Layer Selector + Always-Visible Compact Legend -->
  <nav class="layer-rail" id="layerRail" aria-label="Weather layers">
    <button
      id="mobileLayersToggle"
      class="mobile-layers-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="layerButtons"
    >
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true">
        <path d="M10 3L2.5 7 10 11l7.5-4L10 3zM2.5 11L10 15l7.5-4M2.5 14.5L10 18.5l7.5-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="mobileLayersLabel">Layers</span>
    </button>

    <div id="layerButtons" class="layer-buttons" role="radiogroup" aria-label="Choose weather variable">
      <button class="layer-btn active" type="button" role="radio" aria-checked="true" data-layer="temperature">
        <span class="layer-swatch swatch-temp" aria-hidden="true"></span>
        <span class="layer-name">Temperature</span>
      </button>
      <button class="layer-btn" type="button" role="radio" aria-checked="false" data-layer="anomaly">
        <span class="layer-swatch swatch-anom" aria-hidden="true"></span>
        <span class="layer-name">Temp Anomaly</span>
      </button>
      <button class="layer-btn" type="button" role="radio" aria-checked="false" data-layer="wind">
        <span class="layer-swatch swatch-wind" aria-hidden="true"></span>
        <span class="layer-name">Winds</span>
      </button>
      <button class="layer-btn" type="button" role="radio" aria-checked="false" data-layer="rain">
        <span class="layer-swatch swatch-rain" aria-hidden="true"></span>
        <span class="layer-name">Rainfall</span>
      </button>
      <button class="layer-btn" type="button" role="radio" aria-checked="false" data-layer="pressure">
        <span class="layer-swatch swatch-pres" aria-hidden="true"></span>
        <span class="layer-name">Pressure</span>
      </button>
    </div>

    <div class="legend-card" id="legendCard">
      <div id="legendTitle" class="legend-title">2 m Temperature</div>
      <div id="legendGradient" class="legend-gradient"></div>
      <div class="legend-labels">
        <span id="legendMin">-45 °C</span>
        <span id="legendMid">+2.5 °C</span>
        <span id="legendMax">50 °C</span>
      </div>
    </div>
  </nav>

  <!-- Bottom Centre: Play / Replay Button + Status Notice -->
  <div id="playLauncher" class="play-launcher">
    <div id="tourStatusNotice" class="tour-status-notice" role="status" aria-live="polite" hidden></div>
    <button id="playTourBtn" class="play-tour-btn" type="button" aria-label="Play Headlines">
      <span class="play-circle">
        <svg class="play-triangle" viewBox="0 0 28 28" aria-hidden="true">
          <path d="M8.6 6.6c0-1 .95-1.58 1.82-1.06l11.2 6.84c.82.5.82 1.74 0 2.24l-11.2 6.84c-.87.52-1.82-.06-1.82-1.06V6.6z" fill="currentColor"/>
        </svg>
      </span>
      <span id="playTourCaption" class="play-caption">Play Headlines</span>
    </button>
  </div>

  <!-- Spoken Script Box (Always shown during tour) -->
  <aside id="voiceScriptOverlay" class="voice-script-overlay" hidden aria-live="polite">
    <div id="voiceScriptText" class="voice-script-text"></div>
  </aside>

  <!-- Broadcast Lower-Third Chyron: Controls + Headline + Dual-Speed STORY & IN THE NEWS Scrolling Tickers -->
  <section id="tourHud" class="broadcast-chyron" hidden aria-label="World Weather Headlines">
    <div class="chyron-plate">
      <div class="chyron-strap">
        <span class="strap-live">
          <span class="strap-dot" aria-hidden="true"></span>
          <span id="tourCounter">1 / 5</span>
        </span>
        <span id="tourKicker" class="strap-location">WORLD WEATHER</span>

        <div class="chyron-actions">
          <button id="tourPrev" class="chyron-btn" type="button" aria-label="Previous story">
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
              <path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Prev</span>
          </button>

          <button id="tourNext" class="chyron-btn chyron-btn-next" type="button" aria-label="Next story">
            <span>Next</span>
            <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
              <path d="M7.5 4.5L13 10l-5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <button
            id="tourMuteBtn"
            class="chyron-btn chyron-btn-voice"
            type="button"
            aria-pressed="false"
            aria-label="Toggle sound"
          >
            <svg id="iconSoundOff" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
              <path d="M3.5 7.5h3.2L11 3.8v12.4l-4.3-3.7H3.5V7.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M14 7.5l4 5M18 7.5l-4 5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
            <svg id="iconSoundOn" viewBox="0 0 20 20" width="17" height="17" aria-hidden="true" hidden>
              <path d="M3.5 7.5h3.2L11 3.8v12.4l-4.3-3.7H3.5V7.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M14 6.8a4.5 4.5 0 010 6.4M16.4 4.6a7.6 7.6 0 010 10.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span id="tourMuteLabel">Sound Off</span>
          </button>

          <button id="tourExit" class="chyron-btn chyron-btn-util" type="button" aria-label="Close headlines">
            <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
              <path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            <span>Close</span>
          </button>
        </div>

        <div class="strap-progress" aria-hidden="true">
          <div id="tourProgressBar" class="strap-progress-fill"></div>
        </div>
      </div>

      <!-- Broadcast Headline Banner -->
      <div class="chyron-headline-box">
        <h1 id="tourHeadline" class="chyron-headline"></h1>
      </div>

      <!-- Scrolling Bar 1: Key Findings with Highlighted Figures -->
      <div class="chyron-ticker-bar">
        <div class="ticker-tag">STORY</div>
        <div id="tickerViewport" class="ticker-viewport">
          <div id="tickerTrack" class="ticker-track"></div>
        </div>
      </div>

      <!-- Scrolling Bar 2: Independent-Speed Clickable News Links -->
      <div id="linksBar" class="chyron-links-bar">
        <div class="links-tag">IN THE NEWS</div>
        <div id="linksViewport" class="ticker-viewport">
          <div id="tourNewsLinks" class="links-track"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Subtle Data Attribution (Explore mode) -->
  <footer class="attribution" id="attribFooter">
    <span>Data: © ECMWF CC BY 4.0 · ERA5 (Copernicus C3S) · Guidance only</span>
  </footer>

  <script type="module" src="js/main.js?v=c499fb13"></script>
</body>
</html>
