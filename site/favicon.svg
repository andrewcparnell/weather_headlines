<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#0f2342"/>
      <stop offset="65%" stop-color="#071224"/>
      <stop offset="100%" stop-color="#040913"/>
    </radialGradient>
    <radialGradient id="ocean" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="48%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0b2948"/>
    </radialGradient>
    <linearGradient id="front" x1="0%" y1="75%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="52%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="228" cy="232" r="166"/>
    </clipPath>
  </defs>

  <!-- Opaque square deep-navy background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Atmospheric outer glow -->
  <circle cx="228" cy="232" r="181" fill="none" stroke="#38bdf8" stroke-opacity="0.26" stroke-width="14"/>

  <!-- 3D Earth sphere -->
  <circle cx="228" cy="232" r="166" fill="url(#ocean)"/>

  <!-- Subtle graticule & sweeping weather front clipped to globe -->
  <g clip-path="url(#globeClip)">
    <ellipse cx="228" cy="232" rx="106" ry="166" fill="none" stroke="#bae6fd" stroke-opacity="0.26" stroke-width="6"/>
    <line x1="62" y1="232" x2="394" y2="232" stroke="#bae6fd" stroke-opacity="0.24" stroke-width="6"/>
    <path d="M46 282 C 130 306, 192 166, 284 172 C 342 176, 376 140, 412 112" fill="none" stroke="url(#front)" stroke-width="32" stroke-linecap="round"/>
    <path d="M64 334 C 150 352, 218 234, 318 230 C 362 228, 390 208, 416 186" fill="none" stroke="#fde047" stroke-opacity="0.82" stroke-width="15" stroke-linecap="round"/>
  </g>

  <!-- Crisp globe rim -->
  <circle cx="228" cy="232" r="166" fill="none" stroke="#e0f2fe" stroke-opacity="0.68" stroke-width="7"/>

  <!-- Broadcast Crimson Play Emblem (bottom-right, balanced within iOS safe zone) -->
  <circle cx="358" cy="358" r="92" fill="#050b14"/>
  <circle cx="358" cy="358" r="78" fill="#c8102e" stroke="#ffffff" stroke-width="12"/>
  <path d="M336 319 C336 312, 344 308, 350 312 L404 348 C410 352, 410 364, 404 368 L350 404 C344 408, 336 404, 336 397 Z" fill="#ffffff"/>
</svg>
